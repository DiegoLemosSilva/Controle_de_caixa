{% extends "base.html" %}

{% block title %}Entrar - Controle de Caixa{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-5">
        <h1 class="h4 mb-4 text-center">Controle de Caixa</h1>
        <div class="card">
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% if form.errors %}
                        <div class="alert alert-danger">
                            Usuário ou senha inválidos.
                        </div>
                    {% endif %}
                    <div class="mb-3">
                        <label class="form-label" for="id_username">Usuário</label>
                        <input
                            type="text" name="username" id="id_username"
                            class="form-control" required autofocus
                        >
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="id_password">Senha</label>
                        <input
                            type="password" name="password" id="id_password"
                            class="form-control" required
                        >
                    </div>
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
