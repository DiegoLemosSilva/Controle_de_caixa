{% extends "base.html" %}

{% block title %}Abrir comanda - Controle de Caixa{% endblock %}

{% block content %}
<h1 class="h3 mb-4">Abrir comanda</h1>
<div class="row">
    <div class="col-12 col-md-6">
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Identificação (mesa, nome, etc.)</label>
                {{ form.identifier }}
            </div>
            <div class="mb-3">
                <label class="form-label">Cliente (opcional)</label>
                {{ form.customer }}
            </div>
            <button type="submit" class="btn btn-primary">Abrir comanda</button>
            <a href="{% url 'cash:dashboard' %}" class="btn btn-link">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
